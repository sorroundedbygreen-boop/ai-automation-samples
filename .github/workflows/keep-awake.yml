# 無料の Streamlit Community Cloud は一定時間アクセスが無いと休止するため、
# 定期的にアプリを開いて起こしておく
name: keep-app-awake

on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間ごと
  workflow_dispatch:        # 手動実行用

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/scripts/wake_app.py
